<div id="enlace-visual">
  <style>
    #enlace-visual { color-scheme: light; --en-ink:#253453; --en-muted:#697386; --en-accent:#D76D50; --en-soft:#F4E8E2; --en-canvas:#F7F5F1; --en-surface:#FFFFFF; --en-side:#F0EEE9; --en-line:#E3E4E7; --en-blue:#E8EDF4; --en-green:#426653; --en-green-bg:#EAF1EC; --en-shadow:0 22px 70px #25345321; font:14px/1.5 'Segoe UI',system-ui,sans-serif; color:var(--en-ink); }

  <script>
  (() => {
    const root = document.getElementById('enlace-visual');
    const compact = root.querySelector('[data-variant="Compacto"]');
    const copy = root.querySelector('.el-app').cloneNode(true);
    copy.dataset.design = 'list'; copy.classList.add('el-compact'); compact.append(copy);
    const projects = [
      {id:'landpage',name:'DJANGO_LANDPAGE',letter:'D',folder:'WORKSPACE / DJANGO_LANDPAGE',purpose:'Sites e aplicações',flow:'Criar um site',tag:'Sites · frontend · Django'},
      {id:'licipub',name:'LICIPUB',letter:'L',folder:'APPS / LICIPUB',purpose:'Documentos e contratações',flow:'Preparar um documento',tag:'Documentos · análise · Jev'},
      {id:'social',name:'SOCIAL_APP',letter:'S',folder:'APPS / SOCIAL_APP',purpose:'Conteúdo e publicação',flow:'Criar uma publicação',tag:'Conteúdo · produção · revisão'},
      {id:'enlace',name:'Enlace',letter:'E',folder:'APPS / ENLACE',purpose:'Arquitetura e observabilidade',flow:'Acompanhar um projeto',tag:'Projetos · fluxos · evidências'}
    ];
    const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
    const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const baseNodes = [
      {id:'objective',kind:'Objetivo',name:'Definir o site',icon:'flag',summary:'Transforma a ideia em objetivo, público e critérios de entrega.',source:'PROJETO.md',detail:'Registra o tipo de site, as páginas necessárias, o público e as restrições antes da construção.'},
      {id:'plan',kind:'Skill',name:'Planejar arquitetura',icon:'layers',summary:'Organiza as partes do app e as responsabilidades de cada módulo.',source:'.agents/skills/arquitetura-sistema/SKILL.md',detail:'Propõe limites entre módulos, modelo de dados e contratos de integração. Este caminho é ilustrativo nesta prévia.'},
      {id:'build',kind:'Skill',name:'Construir interface',icon:'panels-top-left',summary:'Transforma a direção visual em telas e interações consistentes.',source:'.agents/skills/frontend-templates/SKILL.md',detail:'Coordena templates, estilos e interações. Consulte as regras de frontend associadas antes de mudar uma tela.'},
      {id:'review',kind:'Etapa',name:'Revisar e entregar',icon:'circle-check',summary:'Verifica a entrega contra o objetivo e os critérios escolhidos.',source:'docs/agentica/FLUXOS.md',detail:'Inclui revisão visual e funcional. Ter uma regra de revisão não comprova que uma revisão foi executada.'},
      {id:'rules',kind:'Regras',name:'AGENTS.md',icon:'shield-check',summary:'Define as instruções gerais para trabalhar neste projeto.',source:'AGENTS.md',detail:'Orienta o agente sobre leitura inicial, limites de atuação, organização e critérios de validação.'},
      {id:'brand',kind:'Contrato',name:'Identidade visual',icon:'palette',summary:'Mantém cores, tipografia e linguagem visual coerentes.',source:'IDENTIDADE.md',detail:'A identidade é material de suporte da construção da interface; aparece separada do caminho principal.'},
      {id:'tests',kind:'Verificação',name:'QA visual e funcional',icon:'clipboard-check',summary:'Especifica o que precisa ser verificado antes da entrega.',source:'docs/FRONTEND.md',detail:'Reúne critérios de responsividade, navegação por teclado, comportamento e acabamento visual.'}
    ];
    const edges = [['objective','plan'],['plan','build'],['build','review'],['rules','plan'],['brand','build'],['tests','review']];
    let saved = window.openai?.widgetState;
    if (saved?.privateContent) saved = saved.privateContent;
    root.querySelectorAll('.el-app').forEach((app, index) => {
      const key = index ? 'compact' : 'spacious';
      const state = { screen:'projects', project:'landpage', view:'declared', selected:null, support:false, modal:null, inspectorTab:'element', query:'', chatQuestion:'', ...saved?.[key] };
      state.modal = null;
      let trigger = null, toastTimer = null;
      const main = app.querySelector('.el-main'), layer = app.querySelector('.el-layer'), dialog = app.querySelector('.el-dialog');
      const project = () => projects.find(p => p.id === state.project) || projects[0];
      const nodes = () => baseNodes.map(n => n.id === 'objective' ? {...n,name:project().flow} : n);
      function icons() { if (window.lucide) window.lucide.createIcons({attrs:{width:16,height:16,'stroke-width':1.6}}); }
      function save() {
        const states = {};
        root.querySelectorAll('.el-app').forEach(a => { if (a.enlaceState) states[a.dataset.design === 'cards' ? 'spacious' : 'compact'] = {...a.enlaceState, modal:null}; });
        window.openai?.setWidgetState?.({modelContent:{screen:state.screen,project:project().name,selectedElement:state.selected,visualVariant:app.dataset.design},privateContent:states}).catch(() => {});
      }
      app.enlaceState = state;
      function tabs(active) {
        return `<div class="el-tabs" aria-label="Áreas do projeto"><button class="el-tab cursor-interaction" data-screen="dashboard" aria-pressed="${active === 'dashboard'}">${icon('layout-dashboard')}Visão geral</button><button class="el-tab cursor-interaction" data-screen="map" aria-pressed="${active === 'map'}">${icon('workflow')}Mapa</button><button class="el-tab cursor-interaction" data-screen="analysis" aria-pressed="${active === 'analysis'}">${icon('scan-line')}Análise</button></div>`;
      }
      function projectHeading() {
        return `<div class="el-heading"><div><p class="el-eyebrow">${escape(project().purpose)}</p><h1>${escape(project().name)}</h1></div><button class="el-button cursor-interaction" data-notice="A leitura do projeto será conectada na implementação.">${icon('refresh-cw')}Atualizar leitura</button></div>${tabs(state.screen)}`;
      }
      function cards() {
        const filtered = projects.filter(p => `${p.name} ${p.purpose} ${p.tag}`.toLowerCase().includes(state.query.toLowerCase()));
        return filtered.length ? filtered.map(p => `<article class="el-projectcard"><div class="el-cardtop"><span class="el-projectmark">${p.letter}</span><div><h3>${p.name}</h3><p class="el-caption">${p.purpose}</p></div><button class="el-iconbutton cursor-interaction" data-project="${p.id}" aria-label="Abrir ${p.name}">${icon('arrow-up-right')}</button></div><div class="el-projectstates"><div class="el-state"><span>${icon('layers')}Estrutura</span><span class="el-badge">Exemplo visual</span></div><div class="el-state"><span>${icon('activity')}Execução</span><span class="el-badge el-badge-soft">Não conectada</span></div></div><div class="el-cardbottom"><span class="el-tag">${p.letter === 'D' ? 'Sites e apps' : p.letter === 'L' ? 'Documentos' : p.letter === 'S' ? 'Conteúdo' : 'Governança'}</span><button class="el-textbutton cursor-interaction" data-project="${p.id}">Abrir projeto ${icon('arrow-right')}</button></div></article>`).join('') : '<p class="el-caption">Nenhum projeto com esse termo na prévia.</p>';
      }
      function portfolio() {
        return `<div class="el-heading"><div><p class="el-eyebrow">Central de projetos</p><h1>Seu workspace, conectado.</h1><p class="el-subtitle">Encontre projetos. Entenda os caminhos.</p></div><button class="el-button el-button-primary cursor-interaction" data-connect>${icon('plus')}Vincular projeto</button></div><div class="el-toolbar"><label class="el-search">${icon('search')}<input type="search" aria-label="Buscar projetos" placeholder="Buscar por projeto ou objetivo" value="${escape(state.query)}"></label><span class="el-caption">${projects.length} projetos na prévia</span></div><div class="el-projectgrid">${cards()}</div><div class="el-bottomhint">${icon('folder-open')}Pastas, regras e fluxos em uma única central.</div>`;
      }
      function dashboard() {
        return `${projectHeading()}<div class="el-evidencegrid"><section class="el-evidence"><div class="el-row"><h3>${icon('layers')} Arquitetura declarada</h3><span class="el-badge">Exemplo</span></div><div class="el-evidencestate">Estrutura do projeto</div><p class="el-caption">Skills, regras e contratos conectados.</p><button class="el-textbutton cursor-interaction" data-screen="map">Explorar mapa ${icon('arrow-right')}</button></section><section class="el-evidence"><div class="el-row"><h3>${icon('activity')} Execução observada</h3><span class="el-badge el-badge-soft">Sem conector</span></div><div class="el-evidencestate">Aguardando evidências</div><p class="el-caption">Quando, como e por que cada etapa foi acionada.</p><button class="el-textbutton cursor-interaction" data-screen="map" data-observed>Ver acompanhamento ${icon('arrow-right')}</button></section></div><section class="el-panel"><div class="el-row"><h3>Caminhos para este projeto</h3><span class="el-caption">Ilustrativos</span></div><div class="el-flowrow"><span class="el-smallmark">${icon('workflow')}</span><div><h3>${escape(project().flow)}</h3><p class="el-caption">Do objetivo à revisão</p></div><button class="el-textbutton cursor-interaction" data-screen="map">Ver fluxo ${icon('arrow-up-right')}</button></div><div class="el-flowrow"><span class="el-smallmark">${icon('scan-line')}</span><div><h3>Revisar a arquitetura</h3><p class="el-caption">Lacunas, dependências e pontos de atenção</p></div><button class="el-textbutton cursor-interaction" data-screen="analysis">Analisar ${icon('arrow-up-right')}</button></div></section><details><summary>Pasta e fontes do projeto</summary><div class="el-detailbody"><div class="el-sourceitem">${icon('folder')} ${escape(project().folder)}</div><p>Esta apresentação usa conteúdo ilustrativo; não é um inventário do projeto.</p></div></details>`;
      }
      function map() {
        const graph = state.view === 'observed' ? `<div class="el-mapempty">${icon('unplug')}<h3>Conecte as evidências de execução</h3><p>O fluxo descrito nos arquivos aparece na arquitetura. As execuções reais entram aqui com origem e horário.</p><button class="el-button cursor-interaction" data-notice="Na implementação, esta ação abrirá os conectores disponíveis para o projeto.">${icon('plug')}Ver conectores</button></div>` : `<div class="el-stage${state.support ? ' has-support' : ''}"><svg class="el-links" aria-hidden="true"></svg>${nodes().filter((n,i)=>i<4 || state.support).map(n=>`<button class="el-node cursor-interaction" data-node="${n.id}" aria-label="Selecionar ${escape(n.name)}"><small>${icon(n.icon)}${n.kind}</small><strong>${escape(n.name)}</strong></button>`).join('')}</div>`;
        const selected = nodes().find(n => n.id === state.selected);
        return `${projectHeading()}<div class="el-viewcontrols"><div class="el-segment" aria-label="Origem das evidências"><button class="cursor-interaction" data-view="declared" aria-pressed="${state.view === 'declared'}">Arquitetura</button><button class="cursor-interaction" data-view="observed" aria-pressed="${state.view === 'observed'}">Execução</button></div>${state.view === 'declared' ? `<button class="el-textbutton cursor-interaction" data-support aria-pressed="${state.support}">${icon('folder-tree')}${state.support ? 'Ocultar apoio' : 'Mostrar apoio'}</button>` : '<span class="el-caption">Conector ainda não configurado</span>'}</div><section class="el-map"><div class="el-mapheader"><div><h3>${escape(project().flow)}</h3><p class="el-caption">${state.view === 'declared' ? 'Caminho principal e referências de apoio' : 'Atividade, duração e resultado por etapa'}</p></div><span class="el-badge el-badge-soft">Fluxo ilustrativo</span></div>${graph}<div class="el-mapfooter"><div class="el-legend"><span><b></b>Conexão</span><span><b class="el-legend-selected"></b>Seleção</span></div><button class="el-textbutton cursor-interaction" data-reset>${icon('focus')}Limpar seleção</button></div></section>${selected && state.view === 'declared' ? `<div class="el-selectedbar">${icon(selected.icon)}<strong>${escape(selected.name)}</strong><button class="el-textbutton cursor-interaction" data-inspect>Detalhes ${icon('arrow-up-right')}</button><button class="el-iconbutton cursor-interaction" data-chat aria-label="Perguntar ao assistente sobre ${escape(selected.name)}">${icon('sparkles')}</button></div>` : ''}<details><summary>Ver o fluxo como lista</summary><div class="el-detailbody">${nodes().slice(0,4).map(n => `<div class="el-sourceitem">${icon(n.icon)}<button class="el-textbutton cursor-interaction" data-node="${n.id}">${escape(n.name)}</button></div>`).join('')}</div></details>`;
      }
      function analysis() {
        return `${projectHeading()}<div class="el-panel"><div class="el-row"><h3>O fluxo atende ao objetivo?</h3><span class="el-badge el-badge-soft">Jev · a configurar</span></div><div class="el-analysisitem">${icon('target')}<div><h3>${escape(project().flow)}</h3><p>A análise relaciona o objetivo às etapas, contratos e evidências do projeto.</p><button class="el-textbutton cursor-interaction" data-chat>Conversar sobre o objetivo ${icon('arrow-right')}</button></div></div><div class="el-analysisitem">${icon('git-branch')}<div><h3>Lacunas na arquitetura</h3><p>Etapas sem responsável, regras sem consumidor e dependências pouco claras.</p><details><summary>Como aparece uma recomendação</summary><div class="el-detailbody"><strong>Exemplo: revisão sem critério explícito.</strong><p>O analista mostrará a fonte, o impacto no objetivo e uma mudança sugerida. Hipóteses ficam separadas de fatos.</p></div></details></div></div><div class="el-analysisitem">${icon('timer')}<div><h3>Gargalos na execução</h3><p>Tempo por etapa, tentativas e falhas, quando houver registros conectados.</p><span class="el-caption">Sem evidências, não há diagnóstico de desempenho.</span></div></div><div class="el-row"><span class="el-caption">Nenhuma análise de IA foi executada.</span><button class="el-button el-button-primary cursor-interaction" data-chat>${icon('sparkles')}Definir análise</button></div></div>`;
      }
      function render() {
        main.innerHTML = state.screen === 'projects' ? portfolio() : state.screen === 'dashboard' ? dashboard() : state.screen === 'map' ? map() : analysis();
        app.querySelector('[data-breadcrumb]').textContent = state.screen === 'projects' ? 'Projetos' : project().name;
        app.querySelectorAll('.el-navbutton[data-screen]').forEach(b=>b.classList.toggle('is-current',b.dataset.screen === (state.screen === 'dashboard' ? 'projects' : state.screen)));
        icons(); requestAnimationFrame(draw);
      }
      function draw() {
        const stage = main.querySelector('.el-stage'); if (!stage) return;
        const svg = stage.querySelector('.el-links'), box = stage.getBoundingClientRect();
        const bounds = {};
        stage.querySelectorAll('[data-node]').forEach(b => { const r=b.getBoundingClientRect(); bounds[b.dataset.node]={x:r.left-box.left,y:r.top-box.top,w:r.width,h:r.height}; });
        svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);
        const near = new Set([state.selected]);
        edges.forEach(([a,b])=>{if(a === state.selected || b === state.selected){near.add(a);near.add(b);}});
        svg.innerHTML=edges.map(([a,b])=>{
          const s=bounds[a], t=bounds[b]; if(!s || !t)return '';
          const horizontal=Math.abs(s.y-t.y)<25;
          const x1=horizontal ? t.x>s.x ? s.x+s.w : s.x : s.x+s.w/2, y1=horizontal ? s.y+s.h/2 : t.y>s.y ? s.y+s.h : s.y;
          const x2=horizontal ? t.x>s.x ? t.x : t.x+t.w : t.x+t.w/2, y2=horizontal ? t.y+t.h/2 : t.y>s.y ? t.y : t.y+t.h;
          const d=horizontal ? `M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}` : `M${x1},${y1} C${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2}`;
          const lit=a===state.selected || b===state.selected;
          return `<path d="${d}" class="${state.selected ? lit ? 'is-lit' : 'is-muted' : ''}"/>`;
        }).join('');
        stage.querySelectorAll('[data-node]').forEach(b=>{b.classList.toggle('is-selected',b.dataset.node===state.selected);b.classList.toggle('is-near',!!state.selected&&near.has(b.dataset.node)&&b.dataset.node!==state.selected);b.classList.toggle('is-muted',!!state.selected&&!near.has(b.dataset.node));b.setAttribute('aria-pressed',String(b.dataset.node===state.selected));});
      }
      function close() { layer.hidden=true; state.modal=null; if(trigger?.isConnected)trigger.focus({preventScroll:true}); }
      function open(type,button) {
        if(button && !dialog.contains(button))trigger=button; state.modal=type; layer.hidden=false;
        dialog.classList.toggle('el-chatdialog',type === 'chat');
        renderDialog(); requestAnimationFrame(()=>{dialog.querySelector('[data-close]')?.focus({preventScroll:true});dialog.scrollIntoView({block:'nearest',behavior:'instant'});});
      }
      function renderDialog() {
        if(state.modal === 'inspect') {
          const n=nodes().find(n=>n.id===state.selected)||nodes()[0];
          dialog.setAttribute('aria-label',n.name);
          const content=state.inspectorTab === 'element' ? `<p class="el-dialogdescription">${n.summary}</p><div class="el-row"><span class="el-badge">${n.kind}</span><span class="el-caption">Declaração ilustrativa</span></div><details><summary>Ver descrição completa</summary><div class="el-detailbody">${n.detail}</div></details><details><summary>Pastas, regras e contratos</summary><div class="el-detailbody"><details><summary>${icon('folder')} Fonte do elemento</summary><div class="el-code">${escape(n.source)}\nExemplo de referência · conteúdo não lido nesta prévia.</div></details><details><summary>${icon('file-text')} Regras associadas</summary><div class="el-code">AGENTS.md\nIDENTIDADE.md\ndocs/FRONTEND.md</div></details></div></details>` : `<p class="el-dialogdescription">Este elemento participa do caminho “${escape(project().flow)}”. As referências de apoio ficam separadas das etapas.</p><div class="el-steps">${nodes().slice(0,4).map((node,i)=>`<div class="el-step"><span class="el-smallmark">${i+1}</span><div><strong>${escape(node.name)}</strong><p>${node.id===n.id ? 'Elemento selecionado' : node.kind}</p></div></div>`).join('')}</div><details><summary>Ver conexões e critérios</summary><div class="el-detailbody">${edges.filter(([a,b])=>a===n.id || b===n.id).map(([a,b])=>`<p>${escape(nodes().find(x=>x.id===a).name)} → ${escape(nodes().find(x=>x.id===b).name)}</p>`).join('')}<p>As conexões são exemplos visuais. A leitura real terá indicação da origem.</p></div></details>`;
          dialog.innerHTML=`<div class="el-dialogheader"><div><p class="el-eyebrow">${n.kind}</p><h2>${escape(n.name)}</h2></div><button class="el-iconbutton cursor-interaction" data-close aria-label="Fechar detalhes">${icon('x')}</button></div><div class="el-tabs"><button class="el-tab cursor-interaction" data-inspecttab="element" aria-pressed="${state.inspectorTab === 'element'}">Elemento</button><button class="el-tab cursor-interaction" data-inspecttab="flow" aria-pressed="${state.inspectorTab === 'flow'}">Fluxo</button></div><div class="el-dialogcontent">${content}</div><div class="el-dialogfoot"><span class="el-caption">${icon('link')} Fonte rastreável</span><button class="el-button cursor-interaction" data-chat>${icon('sparkles')}Perguntar ao assistente</button></div>`;
        } else if(state.modal === 'chat') {
          dialog.setAttribute('aria-label','Assistente do Enlace');
          const q=state.chatQuestion;
          let suggested=projects[0]; if(/publica|post|social|conteúdo/i.test(q))suggested=projects[2]; else if(/documen|etp|contrata/i.test(q))suggested=projects[1];
          const video=/video|vídeo/i.test(q);
          const answer = video ? `<div class="el-answer">Uma busca real mostrará apenas projetos com capacidade de vídeo comprovada. <strong>Esta prévia não confirma um fluxo de vídeo.</strong></div><button class="el-button cursor-interaction" data-notice="O catálogo real será consultado após conectar os projetos.">${icon('search')}Procurar capacidades</button>` : `<div class="el-answer">${state.selected ? 'Podemos explorar as responsabilidades, as fontes e as conexões deste elemento.' : `O projeto <strong>${suggested.name}</strong> é o exemplo de caminho para esse objetivo.`}</div><div class="el-chatproject"><h3>${icon('workflow')} ${suggested.flow}</h3><p>Objetivo → planejamento → construção → revisão</p><button class="el-textbutton cursor-interaction" data-chatflow="${suggested.id}">Mostrar no mapa ${icon('arrow-up-right')}</button><details><summary>O que este caminho faz</summary><p>Organiza as etapas e os elementos de apoio para ${suggested.flow.toLowerCase()}. Na implementação, a resposta virá de fontes reais do projeto.</p></details></div><button class="el-button cursor-interaction" data-prepare>${icon('clipboard-list')}Preparar tarefa</button>`;
          dialog.innerHTML=`<div class="el-dialogheader"><div><p class="el-eyebrow">${state.screen === 'projects' ? 'Todos os projetos' : escape(project().name)}</p><h2>Assistente Enlace</h2></div><button class="el-iconbutton cursor-interaction" data-close aria-label="Fechar assistente">${icon('x')}</button></div><div class="el-chatmessages">${q ? `<div class="el-userbubble">${escape(q)}</div>${answer}` : `<div class="el-chatwelcome"><h3>Qual caminho você procura?</h3><p>Projetos, fluxos e pontos de melhoria.</p></div><div class="el-suggestions"><button class="el-suggestion cursor-interaction" data-question="Como faço para criar um site?">${icon('panels-top-left')} Criar um site</button><button class="el-suggestion cursor-interaction" data-question="Como faço para criar vídeos?">${icon('video')} Criar vídeos</button><button class="el-suggestion cursor-interaction" data-question="Quero analisar este fluxo">${icon('scan-line')} Analisar um fluxo</button></div>`}<span class="el-caption">Conversa demonstrativa · nenhuma IA conectada</span></div><form class="el-chatinput"><input aria-label="Mensagem ao assistente" placeholder="Pergunte sobre seus projetos…" maxlength="400"><button class="el-iconbutton cursor-interaction" type="submit" aria-label="Enviar mensagem">${icon('arrow-up')}</button></form>`;
        } else if(state.modal === 'connect') {
          dialog.setAttribute('aria-label','Vincular projeto');
          dialog.innerHTML=`<div class="el-dialogheader"><div><p class="el-eyebrow">Novo projeto</p><h2>Conectar uma pasta</h2></div><button class="el-iconbutton cursor-interaction" data-close aria-label="Fechar cadastro">${icon('x')}</button></div><div class="el-dialogcontent"><label class="el-formlabel">Pasta do projeto<input class="el-forminput" aria-label="Pasta do projeto" value="C:\\Users\\juanm\\OneDrive\\Desktop\\WORKSPACE" readonly></label><div class="el-folderlist">${projects.slice(0,3).map(p=>`<button class="cursor-interaction" data-folder="${p.id}">${icon('folder')} ${p.name} ${icon('chevron-right')}</button>`).join('')}</div><div class="el-checkline">${icon('shield-check')}Leitura de regras, skills e contratos</div><div class="el-checkline">${icon('lock-keyhole')}Credenciais e bancos ficam de fora</div><details><summary>Como funciona a conexão</summary><div class="el-detailbody">Escolher pasta → revisar o que foi detectado → ativar o acompanhamento. Esta tela apenas demonstra a seleção.</div></details></div><div class="el-dialogfoot"><span class="el-caption">Nenhuma pasta será lida nesta prévia.</span></div>`;
        } else if(state.modal === 'prepare') {
          dialog.setAttribute('aria-label','Preparar tarefa');
          dialog.innerHTML=`<div class="el-dialogheader"><div><p class="el-eyebrow">Tarefa preparada · exemplo</p><h2>Criar um site</h2></div><button class="el-iconbutton cursor-interaction" data-close aria-label="Fechar tarefa">${icon('x')}</button></div><div class="el-dialogcontent"><p class="el-dialogdescription">Projeto sugerido: DJANGO_LANDPAGE. O objetivo e os critérios serão revisados antes de encaminhar a tarefa.</p><div class="el-steps"><div class="el-step"><span class="el-smallmark">1</span><div><strong>Definir o objetivo</strong><p>Tipo de site, público e páginas.</p></div></div><div class="el-step"><span class="el-smallmark">2</span><div><strong>Escolher o fluxo</strong><p>Arquitetura, frontend e revisão.</p></div></div><div class="el-step"><span class="el-smallmark">3</span><div><strong>Revisar o encaminhamento</strong><p>Executor, escopo e resultado esperado.</p></div></div></div></div><div class="el-dialogfoot"><span class="el-caption">Nenhuma tarefa será executada.</span><button class="el-button cursor-interaction" data-chat>Voltar à conversa</button></div>`;
        }
        icons();
      }
      function notice(message) { const toast=app.querySelector('.el-toast'); toast.textContent=message; toast.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{toast.hidden=true;},4000); }
      app.addEventListener('click',event=>{
        const b=event.target.closest('button');
        if(!b) {if(event.target===layer)close();return;}
        if(b.hasAttribute('data-close')){close();return;}
        if(b.dataset.notice){notice(b.dataset.notice);return;}
        if(b.dataset.screen){close();state.screen=b.dataset.screen;state.selected=null;if(b.hasAttribute('data-observed'))state.view='observed';render();save();return;}
        if(b.dataset.project){close();state.project=b.dataset.project;state.screen='dashboard';state.selected=null;state.view='declared';render();save();return;}
        if(b.dataset.view){state.view=b.dataset.view;state.selected=null;render();save();return;}
        if(b.dataset.node){state.selected=b.dataset.node;state.inspectorTab='element';render();main.querySelector(`[data-node="${state.selected}"]`)?.focus({preventScroll:true});save();return;}
        if(b.hasAttribute('data-support')){state.support=!state.support;render();save();return;}
        if(b.hasAttribute('data-inspect')){open('inspect',b);return;}
        if(b.dataset.inspecttab){state.inspectorTab=b.dataset.inspecttab;renderDialog();save();return;}
        if(b.hasAttribute('data-chat')){open('chat',b);return;}
        if(b.hasAttribute('data-connect')){open('connect',b);return;}
        if(b.dataset.folder){notice(`${projects.find(p=>p.id===b.dataset.folder).name}: a detecção real será feita após a implementação.`);return;}
        if(b.dataset.question){state.chatQuestion=b.dataset.question;renderDialog();save();return;}
        if(b.dataset.chatflow){close();state.project=b.dataset.chatflow;state.screen='map';state.view='declared';state.selected='build';render();save();return;}
        if(b.hasAttribute('data-prepare')){open('prepare',b);return;}
        if(b.hasAttribute('data-reset')){state.selected=null;render();save();return;}
      });
      app.addEventListener('input',event=>{if(event.target.matches('[aria-label="Buscar projetos"]')){state.query=event.target.value;main.querySelector('.el-projectgrid').innerHTML=cards();icons();save();}});
      app.addEventListener('submit',event=>{event.preventDefault();if(event.target.matches('.el-chatinput')){const value=event.target.querySelector('input').value.trim();if(value){state.chatQuestion=value;renderDialog();save();}}});
      app.addEventListener('keydown',event=>{
        if(layer.hidden)return;
        if(event.key==='Escape'){event.preventDefault();close();}
        if(event.key==='Tab'){
          const items=[...dialog.querySelectorAll('button,input,summary')].filter(e=>e.getClientRects().length&&!e.disabled);
          const first=items[0],last=items[items.length-1];
          if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
          else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
        }
      });
      new ResizeObserver(draw).observe(main);
      new MutationObserver(()=>{if(!app.closest('[data-variant]').hidden)requestAnimationFrame(draw);}).observe(app.closest('[data-variant]'),{attributes:true,attributeFilter:['hidden']});
      render();
      app.enlaceRestore = incoming => { if(!incoming)return; if(['projects','dashboard','map','analysis'].includes(incoming.screen))state.screen=incoming.screen; if(projects.some(p=>p.id===incoming.project))state.project=incoming.project; if(['declared','observed'].includes(incoming.view))state.view=incoming.view; state.query=String(incoming.query||''); state.selected=nodes().some(n=>n.id===incoming.selected)?incoming.selected:null; state.support=!!incoming.support; close(); render(); };
      const design={radius:13};
      if(window.Tweak){const tweak=new window.Tweak({container:app,onChange:()=>app.querySelectorAll('.el-projectcard').forEach(c=>c.style.borderRadius=app.dataset.design==='cards'?`${design.radius}px`:'0')});tweak.addSlider(design,'radius',{label:'Arredondamento dos cards',min:6,max:20,unit:'px'});}
    });
    window.addEventListener('openai:set_globals',event=>{
      let incoming=event.detail?.globals?.widgetState; if(incoming?.privateContent)incoming=incoming.privateContent;
      if(!incoming)return;
      root.querySelectorAll('.el-app').forEach(app=>app.enlaceRestore?.(incoming[app.dataset.design==='cards'?'spacious':'compact']));
    });
  })();
  </script>
</div>
